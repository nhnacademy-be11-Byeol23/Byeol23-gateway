server:
  port: 10336

spring:
  application:
    name: byeol23-gateway
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true # ?? ???? ???
    gateway:
      server:
        webflux:
          routes:
            - id: backend-service
              uri: lb://BACKEND-SERVICE
              predicates:
                - Path=/api/**



logging:
  level:
    root: debug

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: [health, info]